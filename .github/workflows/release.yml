name: Scheduled Release v2.8.0

on:
  schedule:
    # 25 de Junio a las 20:00 UTC (Equivale a las 3:00 PM en Colombia UTC-5)
    - cron: '0 20 25 6 *'
  workflow_dispatch: # Permite ejecución manual de emergencia desde la pestaña Actions

jobs:
  release:
    name: Publish Scheduled Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package
        run: pnpm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.0
          name: "Cipher Studio v2.8.0 — Agente IA, SQL Viewer & Custom Skills"
          body: |
            ## Cipher Studio v2.8.0 — Release Oficial

            Esta versión consolida el producto unificado **Cipher Studio**, integrando el Agente de IA con soporte de directrices agénticas y habilidades personalizadas, el SQL Viewer con creación de bases de datos físicas SQLite y conexiones a contenedores Docker, y un diseño visual premium y serio.

            ---

            ### 🚀 Características Principales

            - **🤖 Agente Autónomo**: Soporte dinámico para inyección de directrices globales (`AGENTS.md`) y creación/administración interactiva de habilidades personalizadas (`.agents/skills/`).
            - **🔌 Infraestructura MCP**: Panel lateral de Model Context Protocol independiente del chat.
            - **💾 SQL Viewer & SQLite físico**: Visualizador de bases de datos integrado, capacidad de crear bases de datos SQLite locales físicas y soporte de conexiones para contenedores Docker con SVGs de marca oficiales.
            - **📁 Iconografía de Archivos Expandida**: Mapeo visual nativo de Dockerfile, .npmrc y archivos de bloqueo de pnpm (`pnpm.svg`).
            - **🎨 Diseño Premium**: Nueva identidad visual unificada, reduciendo el ruido visual para un entorno de programación serio y profesional.
          files: |
            release/Cipher Studio Setup 2.8.0.exe
            release/Cipher Studio-2.8.0-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

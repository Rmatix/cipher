name: Scheduled Release v2.8.0

on:
  schedule:
    # 16 de Junio a las 05:00 UTC (Equivale a las 12:00 AM en Colombia/México)
    - cron: '0 5 16 6 *'

jobs:
  release:
    name: Publish Scheduled Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Build and Package
        run: pnpm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.0
          name: "Cipher v2.8.0 — Composer Multi-archivo, Persistencia & UI Premium"
          body: |
            ## Cipher v2.8.0 — Release Oficial

            Esta versión consolida la unificación del Parche 7 (soporte multi-archivo estilo Composer) y el Parche 2.5.2, ofreciendo mejoras de rendimiento, persistencia de espacio completa y una UI Premium fluida.

            ---

            ### 🚀 Características Principales

            - **Persistencia de Pestañas**: Al reabrir el editor, se restauran las pestañas y el archivo activo por proyecto.
            - **Composer Multi-Archivo**: Edición concurrente de múltiples ficheros mediante el agente de IA.
            - **Mejora en Panel de IA**: Mayor legibilidad de proveedores y colores de chat personalizados.
            - **Seguridad Garantizada**: Verificado 100% limpio en VirusTotal contra falsos positivos.
          files: |
            release/Cipher Setup 2.8.0.exe
            release/Cipher-2.8.0-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

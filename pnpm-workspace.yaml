packages:
  - '.'
  - 'renderer'

allowBuilds:
  better-sqlite3: true
  core-js: true
  electron-winstaller: true
  node-pty: true

overrides:
  # ── Security patches (v2.8.2) ────────────────────────────────────────────
  # GHSA-5p4m-2wfm-xmqj: JS-YAML quadratic CPU consumption (CVE-2026-59870)
  js-yaml: '>=4.3.1'
  # GHSA-rgw5-rvv9-x895: brace-expansion DoS bypassing CVE-2026-14257
  brace-expansion: '>=5.0.9'
  # GHSA-7p8r-x3mc-p8w7: fast-uri host confusion via backslash
  fast-uri: '>=4.1.2'
  # GHSA-2v37-7h3g-55p8: nanoid infinite loop with size=0
  nanoid: '>=3.3.18'
  # GHSA-55q2-fjhq-7xh7: DOMPurify XSS via IN_PLACE hook removal
  dompurify: '>=3.4.13'

  # ── Previous security overrides ──────────────────────────────────────────
  shell-quote: '^1.8.6'
  tar: '>=7.5.17'
  postcss: '^8.5.10'
  form-data: '^4.0.6'
  request>form-data: '^2.5.6'
  lodash: '^4.17.24'
  uuid: '^11.1.1'
  qs: '^6.14.1'
  tough-cookie: '^4.1.3'
  request: '^2.88.2'
  undici: '^6.27.0'
  '@electron/get>undici': '^7.28.0'
